name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

# أقل صلاحيات ممكنة للـ GITHUB_TOKEN الافتراضي — بدون هذا السطر يحصل التوكن
# على صلاحية قراءة/كتابة واسعة تلقائياً حتى لو ما يحتاجها أي job هنا فعلياً
# (كل الأعمال هنا قراءة فقط: checkout، فحص، بناء — بدون أي نشر أو كتابة
# حقيقية للمستودع حالياً). هذا ما كان يطلبه تنبيه CodeQL بالخمس مواضع.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # حذفنا 16.x — وصل نهاية الدعم (EOL) وهذا سبب أحد تنبيهات الأمان؛
        # 18.x و20.x كافيين للتأكد من التوافق بدون استخدام إصدار غير مدعوم.
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test --if-present
    
    - name: Build project
      run: npm run build
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '18.x'

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
    
    - name: Run OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      continue-on-error: true
      with:
        project: 'rakaez-erp'
        path: '.'
        format: 'JSON'

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Deploy to Development
      run: echo "Deploying to development server..."
      # أضف أوامر التحديث الفعلية هنا

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Deploy to Production
      run: echo "Deploying to production server..."
      # أضف أوامر التحديث الفعلية هنا

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: rakaez-erp:latest