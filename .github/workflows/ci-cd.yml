name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

# أقل صلاحيات ممكنة للـ GITHUB_TOKEN الافتراضي — بدون هذا السطر يحصل التوكن
# على صلاحية قراءة/كتابة واسعة تلقائياً حتى لو ما يحتاجها أي job هنا فعلياً
# (كل الأعمال هنا قراءة فقط: checkout، فحص، بناء — بدون أي نشر أو كتابة
# حقيقية للمستودع حالياً). هذا ما كان يطلبه تنبيه CodeQL بالخمس مواضع.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # حذفنا 16.x — وصل نهاية الدعم (EOL) وهذا سبب أحد تنبيهات الأمان؛
        # 18.x و20.x كافيين للتأكد من التوافق بدون استخدام إصدار غير مدعوم.
        node-version: [18.x, 20.x]
        # المشروع مقسوم لمجلدين منفصلين، كل واحد فيه package.json خاص به —
        # لا يوجد package.json بجذر المستودع. هذا هو سبب فشل ٣ من ٨ فحوصات
        # سابقاً: الخطوات كانت تشتغل بالجذر مباشرة بدون تحديد working-directory
        # فتفشل فوراً على "npm ci" (ما تلقى ملف package.json أصلاً).
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint --if-present

    - name: Run tests
      run: npm test --if-present

    - name: Build project
      # --if-present لأن الباك إند (Node/Express) ما له سكربت "build" أصلاً
      # (سكربتاته فقط dev/start) — فقط الفرونت إند (Vite) يبني فعلياً.
      run: npm run build --if-present

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '18.x' && matrix.project == 'frontend'

  security-scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      continue-on-error: true
      with:
        project: 'rakaez-erp-${{ matrix.project }}'
        path: '.'
        format: 'JSON'

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v5

    - name: Deploy to Development
      run: echo "Deploying to development server..."
      # أضف أوامر التحديث الفعلية هنا

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v5

    - name: Deploy to Production
      run: echo "Deploying to production server..."
      # أضف أوامر التحديث الفعلية هنا

  # docker-build مُعطّل مؤقتاً: كان يحاول يبني صورة Docker من جذر المستودع
  # لكن لا يوجد أي Dockerfile بالمشروع حالياً (لا بالجذر ولا بأي مجلد) —
  # فكان يفشل في كل مرة من الأساس. أعد تفعيله (احذف الـ # من كل سطر تحت)
  # بعد ما تضيف Dockerfile حقيقي لأحد المجلدين (غالباً backend للنشر).
